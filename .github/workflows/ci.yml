name: CI

on:
  push:
    branches: [main]
  pull_request:

# Set explicitly rather than relying on the system default: scikit-build-core
# takes the compiler from the interpreter's build configuration, which on Ubuntu
# is a triplet-prefixed name that update-alternatives leaves on the older GCC.
env:
  CXX: g++-14
  CC: gcc-14

jobs:
  test:
    # Not "the tests pass" - they passed locally - but that the build works on a
    # machine that is not the developer's, across the advertised Python range.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14

      - name: Build and install
        # Build isolation left on, unlike the local dev loop: this must prove the
        # declared build dependencies are sufficient on their own.
        #
        # Not ccache'd, unlike cpp-tests and minimum-cmake. Isolation means pip
        # builds in a fresh environment every time, so most of this job resolves
        # and downloads rather than compiles, and caching bought nothing.
        run: python -m pip install ".[test]" --verbose

      - name: Test
        # From the repo root, so pytest finds tests/ while `ahocorasick_demo`
        # resolves to the installed wheel. Benchmarks are already skipped by
        # addopts; repeated so the intent survives an edit to pyproject.toml.
        run: python -m pytest -v --benchmark-skip

      - name: Check compile_commands.json was generated
        # clangd and clang-tidy depend on it, so notice if it stops appearing.
        run: test -f build/*/compile_commands.json

      - name: Check the generated stub shipped
        run: |
          python - <<'EOF'
          import pathlib
          from ahocorasick_demo import _core
          stub = pathlib.Path(_core.__file__).parent / "_core.pyi"
          assert stub.is_file(), "nanobind_add_stub did not install _core.pyi"
          assert "class PatternMatcher" in stub.read_text()
          print(stub.read_text())
          EOF

  standalone-library:
    # The claim the layout is built on: the algorithm compiles with no Python, no
    # nanobind and no scikit-build-core. A leaked nanobind include fails here.
    #
    # Tests off explicitly. They default ON for a bare `cmake`, and fetching
    # Catch2 needs the network, which would weaken this from "builds with nothing
    # installed" to "builds with nothing but a framework downloaded on the way".
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14

      - name: Configure and build the library alone
        run: |
          cmake -S . -B build-standalone -G Ninja -DAHOCORASICK_BUILD_TESTS=OFF
          cmake --build build-standalone

      - name: Assert the Python module was not built
        run: |
          test -f build-standalone/libaho_corasick.a
          ! ls build-standalone/_core*.so 2>/dev/null

  cpp-tests:
    # The algorithm's own suite, without Python. Both link modes for different
    # reasons: static is what wheels use, and shared is the only configuration
    # that links a consumer - which turns a missing AHOCORASICK_EXPORT into a
    # failure here rather than in somebody else's project.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shared: ["OFF", "ON"]

    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@v4

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14 ccache

      - name: Restore the compiler cache
        # Catch2 is nearly every translation unit here and never changes. The
        # module units are the exception, and ccache declines them rather than
        # risk a wrong answer under the module-scanning flags - which splits it
        # exactly right: the unchanging bulk cached, the live files not.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-cpp-tests-${{ matrix.shared }}-${{ github.sha }}
          restore-keys: ccache-cpp-tests-${{ matrix.shared }}-

      - name: Configure and build
        run: |
          ccache -z    # counters only; the cache itself is kept
          cmake -S . -B build-cpp -G Ninja \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          cmake --build build-cpp

      - name: Report cache effectiveness
        # A cache nobody measures is a guess. Near zero on a key's first run,
        # near total afterwards; a rate that falls back to zero means the key or
        # the compile flags changed.
        run: ccache -s

      - name: Test
        run: ctest --test-dir build-cpp --output-on-failure

  installed-package:
    # Proves the library is reusable rather than merely separable: a project that
    # has never seen this tree finds it and imports the module. An installed
    # module ships as source, so this also checks the generated export header and
    # the static define reach a consumer that compiles the interface itself.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shared: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14

      - name: Build and install the library
        run: |
          cmake -S . -B build-inst -G Ninja \
            -DAHOCORASICK_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build-inst
          cmake --install build-inst

      - name: Write a consumer that only knows find_package
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(consumer LANGUAGES CXX)
          find_package(ahocorasick 0.1 REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ahocorasick::core)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <cstdio>
          #include <string>
          #include <vector>

          import aho_corasick;

          int main() {
              const std::vector<std::string> patterns{"he", "she", "hers"};
              const ac::PatternMatcher matcher(patterns);
              const auto found =
                  matcher.find_all("ushers", ac::PatternMatcher::Offsets::Bytes);
              std::printf("states=%zu matches=%zu\n", matcher.num_states(), found.size());
              return (matcher.num_states() == 8 && found.size() == 3) ? 0 : 1;
          }
          EOF

      - name: Configure, build and run the consumer
        run: |
          cmake -S consumer -B consumer/build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer/build
          LD_LIBRARY_PATH="$PWD/prefix/lib" ./consumer/build/consumer

      - name: Assert the package rejects an incompatible version
        # SOVERSION and the package version share one root, so this pins that
        # they cannot drift apart.
        run: |
          sed -i 's/ahocorasick 0.1 REQUIRED/ahocorasick 9.0 REQUIRED/' consumer/CMakeLists.txt
          if cmake -S consumer -B consumer/build-ver -G Ninja \
               -DCMAKE_PREFIX_PATH="$PWD/prefix" 2>err.txt; then
            echo "expected find_package to reject version 9.0"
            exit 1
          fi
          grep -q "compatible with requested version" err.txt

  minimum-cmake:
    # A floor nobody configures against is a guess, so 3.28 is tested rather
    # than declared.
    runs-on: ubuntu-24.04

    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14 ccache

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-minimum-cmake-${{ github.sha }}
          restore-keys: ccache-minimum-cmake-

      - name: Install the declared minimum CMake and nanobind
        run: python -m pip install "cmake==3.28.*" ninja nanobind

      - name: Configure and build at the minimum version
        run: |
          ccache -z    # counters only; the cache itself is kept
          cmake --version
          cmake -S . -B build-min -G Ninja \
            -DAHOCORASICK_BUILD_PYTHON_MODULE=ON \
            -DPython_EXECUTABLE="$(which python)"
          cmake --build build-min

      - name: Report cache effectiveness
        run: ccache -s

  rejects-bad-generator:
    # The other half of what the probe checks. Makefiles is CMake's default on
    # Unix and does not scan, so `cmake -B build` with no -G fails on a perfectly
    # capable compiler - with a diagnostic naming the generator and the fix.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14

      - name: Configure with a generator that cannot scan modules
        run: |
          if cmake -S . -B build-make -G "Unix Makefiles" 2>err.txt; then
            echo "expected configuration to fail with the Makefiles generator"
            exit 1
          fi
          cat err.txt
          grep -q "C++20 module" err.txt
          grep -q "Unix Makefiles" err.txt
          grep -q "\-G Ninja" err.txt

  rejects-old-compiler:
    # Failing on a compiler that cannot scan modules is a supported outcome, so
    # the diagnostic is worth testing: it must name the compiler it found,
    # because the usual cause is picking up a different one than expected.
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
      CC: gcc-13
    steps:
      - uses: actions/checkout@v4

      - name: Configure with a compiler that cannot scan modules
        run: |
          if cmake -S . -B build-old -G Ninja 2>err.txt; then
            echo "expected configuration to fail on g++-13"
            exit 1
          fi
          cat err.txt
          grep -q "C++20 module" err.txt
          grep -q "g++-13" err.txt
