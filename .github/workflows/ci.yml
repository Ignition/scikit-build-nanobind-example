name: CI

on:
  push:
    branches: [main]
  pull_request:

# The algorithm is a C++20 module, so every job needs a compiler that can report
# its import graph. CXX is set explicitly rather than relying on the system
# default: scikit-build-core takes the compiler from the interpreter's own build
# configuration, which on Ubuntu is the triplet-prefixed name and stays on the
# distribution's older GCC even after update-alternatives switches g++.
env:
  CXX: g++-14
  CC: gcc-14

jobs:
  test:
    # The point of this job is not "the tests pass" - they passed locally. It is
    # that the build works on a machine that is not the developer's, across the
    # Python range the package advertises in `requires-python`.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    # CMake initializes CMAKE_CXX_COMPILER_LAUNCHER from this, so it reaches the
    # build through `pip install` without threading -D flags through
    # scikit-build-core.
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14 ccache

      - name: Restore the compiler cache
        # nanobind's own sources are most of what this job compiles and they do
        # not change between runs. Keyed by Python version because the binding
        # layer is compiled against each one separately. ccache decides what is
        # actually reusable by hashing preprocessed input, so restoring an older
        # cache is safe - a stale entry misses rather than being served.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-test-${{ matrix.python-version }}-${{ github.sha }}
          restore-keys: ccache-test-${{ matrix.python-version }}-

      - name: Build and install
        # Build isolation left on, unlike the local dev loop: this must prove the
        # declared build dependencies are sufficient on their own. CMake and Ninja
        # come from scikit-build-core's own requirements when absent from the image.
        run: python -m pip install ".[test]" --verbose

      - name: Test
        # Run from the repo root so pytest finds tests/, while `ahocorasick_demo`
        # still resolves to the installed wheel - that is exactly what the src/
        # layout buys us, and tests/test_package_layout.py asserts it.
        # Benchmarks are skipped by addopts already; repeated here so the intent
        # survives an edit to pyproject.toml.
        run: python -m pytest -v --benchmark-skip

      - name: Check compile_commands.json was generated
        # Tooling (clangd, clang-tidy) depends on it, so it is worth noticing if
        # it silently stops appearing.
        run: test -f build/*/compile_commands.json

      - name: Check the generated stub shipped
        run: |
          python - <<'EOF'
          import pathlib
          from ahocorasick_demo import _core
          stub = pathlib.Path(_core.__file__).parent / "_core.pyi"
          assert stub.is_file(), "nanobind_add_stub did not install _core.pyi"
          assert "class PatternMatcher" in stub.read_text()
          print(stub.read_text())
          EOF

  standalone-library:
    # Proves the claim the layout is built on: the algorithm compiles with no
    # Python, no nanobind, and no scikit-build-core anywhere in sight. If someone
    # leaks a nanobind include into the module, this job is what catches it.
    #
    # Tests are turned off explicitly. They default ON for a bare `cmake`, and
    # fetching Catch2 would need the network - which would quietly weaken this
    # job from "builds with nothing installed" to "builds with nothing installed
    # except a test framework downloaded mid-configure". Running the tests is the
    # cpp-tests job's business; this one asserts the dependency-free claim.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14

      - name: Configure and build the library alone
        run: |
          cmake -S . -B build-standalone -G Ninja -DAHOCORASICK_BUILD_TESTS=OFF
          cmake --build build-standalone

      - name: Assert the Python module was not built
        run: |
          test -f build-standalone/libaho_corasick.a
          ! ls build-standalone/_core*.so 2>/dev/null

  cpp-tests:
    # The algorithm's own test suite, run without Python present. Both link modes
    # matter and for different reasons: the static build is what wheels use, and
    # the shared build is the only configuration that actually links a consumer
    # against the library - which is what turns a missing AHOCORASICK_EXPORT into
    # a build failure here rather than a surprise in somebody else's project.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shared: ["OFF", "ON"]

    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@v4

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14 ccache

      - name: Restore the compiler cache
        # Catch2 is ~100 of the ~110 translation units here and never changes.
        # The three that do change are the module units, which ccache declines
        # to cache at all - it does not support the module-scanning flags and
        # says so rather than risking a wrong answer. That is the right split:
        # the unchanging bulk is cached, the files under development are not.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-cpp-tests-${{ matrix.shared }}-${{ github.sha }}
          restore-keys: ccache-cpp-tests-${{ matrix.shared }}-

      - name: Configure and build
        run: |
          cmake -S . -B build-cpp -G Ninja \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          cmake --build build-cpp

      - name: Test
        run: ctest --test-dir build-cpp --output-on-failure

  installed-package:
    # The second consumer of the algorithm/bindings seam, and the one that proves
    # the library is reusable rather than merely separable: a project that has
    # never seen this source tree finds it with find_package and imports the
    # module. Both link modes, because the export macro only matters in one.
    #
    # An installed C++20 module ships as source, so this also checks that the
    # generated export header and the static define reach a consumer that
    # compiles the interface unit itself.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shared: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14

      - name: Build and install the library
        run: |
          cmake -S . -B build-inst -G Ninja \
            -DAHOCORASICK_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build-inst
          cmake --install build-inst

      - name: Write a consumer that only knows find_package
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(consumer LANGUAGES CXX)
          find_package(ahocorasick 0.1 REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ahocorasick::core)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <cstdio>
          #include <string>
          #include <vector>

          import aho_corasick;

          int main() {
              const std::vector<std::string> patterns{"he", "she", "hers"};
              const ac::PatternMatcher matcher(patterns);
              const auto found =
                  matcher.find_all("ushers", ac::PatternMatcher::Offsets::Bytes);
              std::printf("states=%zu matches=%zu\n", matcher.num_states(), found.size());
              return (matcher.num_states() == 8 && found.size() == 3) ? 0 : 1;
          }
          EOF

      - name: Configure, build and run the consumer
        run: |
          cmake -S consumer -B consumer/build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer/build
          LD_LIBRARY_PATH="$PWD/prefix/lib" ./consumer/build/consumer

      - name: Assert the package rejects an incompatible version
        # SOVERSION and the package version share one root (project(VERSION)), so
        # this also pins that they cannot drift apart.
        run: |
          sed -i 's/ahocorasick 0.1 REQUIRED/ahocorasick 9.0 REQUIRED/' consumer/CMakeLists.txt
          if cmake -S consumer -B consumer/build-ver -G Ninja \
               -DCMAKE_PREFIX_PATH="$PWD/prefix" 2>err.txt; then
            echo "expected find_package to reject version 9.0"
            exit 1
          fi
          grep -q "compatible with requested version" err.txt

  minimum-cmake:
    # cmake_minimum_required declares 3.28, the release where FILE_SET
    # CXX_MODULES arrived. A floor nobody configures against is a guess, so this
    # job makes it a tested claim.
    runs-on: ubuntu-24.04

    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14 ccache

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-minimum-cmake-${{ github.sha }}
          restore-keys: ccache-minimum-cmake-

      - name: Install the declared minimum CMake and nanobind
        run: python -m pip install "cmake==3.28.*" ninja nanobind

      - name: Configure and build at the minimum version
        run: |
          cmake --version
          cmake -S . -B build-min -G Ninja \
            -DAHOCORASICK_BUILD_PYTHON_MODULE=ON \
            -DPython_EXECUTABLE="$(which python)"
          cmake --build build-min

  rejects-bad-generator:
    # The other half of what the module probe checks. Only Ninja and Visual
    # Studio scan for modules, and Makefiles is CMake's default on Unix - so
    # `cmake -B build` with no -G fails on a perfectly capable compiler. That was
    # once an opaque CMake error; this job asserts it is now a diagnostic naming
    # the generator and the fix.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14

      - name: Configure with a generator that cannot scan modules
        run: |
          if cmake -S . -B build-make -G "Unix Makefiles" 2>err.txt; then
            echo "expected configuration to fail with the Makefiles generator"
            exit 1
          fi
          cat err.txt
          grep -q "C++20 module" err.txt
          grep -q "Unix Makefiles" err.txt
          grep -q "\-G Ninja" err.txt

  rejects-old-compiler:
    # The build fails on a compiler that cannot scan for modules. That is a
    # supported outcome rather than a crash, so the diagnostic is worth testing:
    # it has to name the compiler it actually found, because the usual cause is
    # picking up a different one than expected.
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
      CC: gcc-13
    steps:
      - uses: actions/checkout@v4

      - name: Configure with a compiler that cannot scan modules
        run: |
          if cmake -S . -B build-old -G Ninja 2>err.txt; then
            echo "expected configuration to fail on g++-13"
            exit 1
          fi
          cat err.txt
          grep -q "C++20 module" err.txt
          grep -q "g++-13" err.txt
