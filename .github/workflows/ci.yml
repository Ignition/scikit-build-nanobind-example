name: CI

on:
  push:
    branches: [main]
  pull_request:

# The algorithm is a C++20 module, so every job needs a compiler that can report
# its import graph. CXX is set explicitly rather than relying on the system
# default: scikit-build-core takes the compiler from the interpreter's own build
# configuration, which on Ubuntu is the triplet-prefixed name and stays on the
# distribution's older GCC even after update-alternatives switches g++.
env:
  CXX: g++-14
  CC: gcc-14

jobs:
  test:
    # The point of this job is not "the tests pass" - they passed locally. It is
    # that the build works on a machine that is not the developer's, across the
    # Python range the package advertises in `requires-python`.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14

      - name: Build and install
        # Build isolation left on, unlike the local dev loop: this must prove the
        # declared build dependencies are sufficient on their own. CMake and Ninja
        # come from scikit-build-core's own requirements when absent from the image.
        run: python -m pip install ".[test]" --verbose

      - name: Test
        # Run from the repo root so pytest finds tests/, while `ahocorasick_demo`
        # still resolves to the installed wheel - that is exactly what the src/
        # layout buys us, and tests/test_package_layout.py asserts it.
        # Benchmarks are skipped by addopts already; repeated here so the intent
        # survives an edit to pyproject.toml.
        run: python -m pytest -v --benchmark-skip

      - name: Check compile_commands.json was generated
        # Tooling (clangd, clang-tidy) depends on it, so it is worth noticing if
        # it silently stops appearing.
        run: test -f build/*/compile_commands.json

      - name: Check the generated stub shipped
        run: |
          python - <<'EOF'
          import pathlib
          from ahocorasick_demo import _core
          stub = pathlib.Path(_core.__file__).parent / "_core.pyi"
          assert stub.is_file(), "nanobind_add_stub did not install _core.pyi"
          assert "class PatternMatcher" in stub.read_text()
          print(stub.read_text())
          EOF

  standalone-library:
    # Proves the claim the layout is built on: the algorithm compiles with no
    # Python, no nanobind, and no scikit-build-core anywhere in sight. If someone
    # leaks a nanobind include into the module, this job is what catches it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14

      - name: Configure and build the library alone
        run: |
          cmake -S . -B build-standalone -G Ninja
          cmake --build build-standalone

      - name: Assert the Python module was not built
        run: |
          test -f build-standalone/libaho_corasick.a
          ! ls build-standalone/_core*.so 2>/dev/null

  minimum-cmake:
    # cmake_minimum_required declares 3.28, the release where FILE_SET
    # CXX_MODULES arrived. A floor nobody configures against is a guess, so this
    # job makes it a tested claim.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14

      - name: Install the declared minimum CMake and nanobind
        run: python -m pip install "cmake==3.28.*" ninja nanobind

      - name: Configure and build at the minimum version
        run: |
          cmake --version
          cmake -S . -B build-min -G Ninja \
            -DAHOCORASICK_BUILD_PYTHON_MODULE=ON \
            -DPython_EXECUTABLE="$(which python)"
          cmake --build build-min

  rejects-bad-generator:
    # The other half of what the module probe checks. Only Ninja and Visual
    # Studio scan for modules, and Makefiles is CMake's default on Unix - so
    # `cmake -B build` with no -G fails on a perfectly capable compiler. That was
    # once an opaque CMake error; this job asserts it is now a diagnostic naming
    # the generator and the fix.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install a module-capable compiler
        run: sudo apt-get install -y g++-14

      - name: Configure with a generator that cannot scan modules
        run: |
          if cmake -S . -B build-make -G "Unix Makefiles" 2>err.txt; then
            echo "expected configuration to fail with the Makefiles generator"
            exit 1
          fi
          cat err.txt
          grep -q "C++20 module" err.txt
          grep -q "Unix Makefiles" err.txt
          grep -q "\-G Ninja" err.txt

  rejects-old-compiler:
    # The build fails on a compiler that cannot scan for modules. That is a
    # supported outcome rather than a crash, so the diagnostic is worth testing:
    # it has to name the compiler it actually found, because the usual cause is
    # picking up a different one than expected.
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
      CC: gcc-13
    steps:
      - uses: actions/checkout@v4

      - name: Configure with a compiler that cannot scan modules
        run: |
          if cmake -S . -B build-old -G Ninja 2>err.txt; then
            echo "expected configuration to fail on g++-13"
            exit 1
          fi
          cat err.txt
          grep -q "C++20 module" err.txt
          grep -q "g++-13" err.txt
